<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖文故事</title>
    <!-- 引入 Tailwind CSS 以實現現代美觀的設計 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* 確保輪播容器維持絕對的 1:1 正方形比例 */
        .square-container {
            position: relative;
            width: 100%;
            max-width: 768px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- 密碼輸入區塊 -->
    <div id="auth-box" class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl shadow-2xl border border-white/10 text-center">
        <h2 class="text-xl font-bold mb-4">請輸入存取密碼</h2>
        <input 
            type="password" 
            id="password-input" 
            placeholder="請輸入密碼" 
            class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 mb-3 text-center tracking-widest text-lg"
            autocomplete="off"
        >
        <p id="error-msg" class="text-rose-500 text-sm mb-3 hidden">密碼錯誤，請重新輸入</p>
        <button 
            id="submit-btn" 
            class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white rounded-lg font-medium transition duration-200">
            確認進入
        </button>
    </div>

    <!-- 主輪播外框 -->
    <main class="w-full max-w-[1024px]" id="main" style="display: none;">
        <div id="carousel"
            class="square-container rounded-2xl overflow-hidden shadow-2xl bg-slate-800 relative select-none group">

            <!-- 輪播軌道 (Track) -->
            <div id="carousel-track"
                class="flex h-full transition-transform duration-500 ease-out cursor-grab active:cursor-grabbing">

                <!-- Slide 1 ~ 17 -->
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./1.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./2.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./3.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./4.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./5.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./6.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./7.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./8.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./9.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./10.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./11.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./12.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./13.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./14.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./15.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./16.jpeg" alt="pic"></div>
                </div>
                <div class="min-w-full h-full relative flex items-center justify-center">
                    <div class="text-center text-white"><img src="./17.jpeg" alt="pic"></div>
                </div>

            </div>

            <!-- 左上角頁數指示器 -->
            <div
                class="absolute top-4 left-4 z-20 bg-slate-900/70 backdrop-blur-md text-white px-3 py-1.5 rounded-full text-xs sm:text-sm font-semibold tracking-wider shadow-lg border border-white/10">
                <span id="current-slide">1</span> / <span id="total-slides">17</span>
            </div>

            <!-- 電腦版左右切換按鈕 -->
            <button id="prev-btn"
                class="absolute left-4 top-1/2 -translate-y-1/2 z-20 bg-slate-900/60 hover:bg-slate-900/90 text-white w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-200 opacity-0 group-hover:opacity-100 hover:scale-105 active:scale-95 shadow-lg border border-white/10 focus:outline-none"
                aria-label="上一張">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <button id="next-btn"
                class="absolute right-4 top-1/2 -translate-y-1/2 z-20 bg-slate-900/60 hover:bg-slate-900/90 text-white w-12 h-12 rounded-full flex items-center justify-center backdrop-blur-md transition-all duration-200 opacity-0 group-hover:opacity-100 hover:scale-105 active:scale-95 shadow-lg border border-white/10 focus:outline-none"
                aria-label="下一張">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>

            <!-- 底部圓點指示器 -->
            <div id="dots-container"
                class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 flex space-x-2 bg-slate-900/40 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10">
            </div>

        </div>
    </main>

    <!-- JavaScript 輪播與驗證邏輯 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 密碼驗證邏輯
            const authBox = document.getElementById('auth-box');
            const mainContent = document.getElementById('main');
            const passwordInput = document.getElementById('password-input');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');

            function checkPassword() {
                if (passwordInput.value.trim() === '0717') {
                    authBox.style.display = 'none';
                    mainContent.style.display = 'block';
                    // 觸發輪播位置與尺寸重算
                    updateCarousel();
                } else {
                    errorMsg.classList.remove('hidden');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            submitBtn.addEventListener('click', checkPassword);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkPassword();
            });

            // 輪播主邏輯
            const track = document.getElementById('carousel-track');
            const slides = Array.from(track.children);
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const currentSlideEl = document.getElementById('current-slide');
            const totalSlidesEl = document.getElementById('total-slides');
            const dotsContainer = document.getElementById('dots-container');

            let currentIndex = 0;
            const totalSlides = slides.length;
            totalSlidesEl.textContent = totalSlides;

            // 建立底部圓點
            slides.forEach((_, i) => {
                const dot = document.createElement('button');
                dot.className = `w-2.5 h-2.5 rounded-full transition-all duration-300 ${i === 0 ? 'bg-white w-6' : 'bg-white/50 hover:bg-white/80'}`;
                dot.setAttribute('aria-label', `跳至第 ${i + 1} 張`);
                dot.addEventListener('click', () => goToSlide(i));
                dotsContainer.appendChild(dot);
            });

            const dots = Array.from(dotsContainer.children);

            function updateCarousel() {
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                currentSlideEl.textContent = currentIndex + 1;

                dots.forEach((dot, i) => {
                    if (i === currentIndex) {
                        dot.className = 'w-6 h-2.5 rounded-full bg-white transition-all duration-300 shadow-sm';
                    } else {
                        dot.className = 'w-2.5 h-2.5 rounded-full bg-white/50 hover:bg-white/80 transition-all duration-300';
                    }
                });
            }

            function nextSlide() {
                currentIndex = (currentIndex + 1) % totalSlides;
                updateCarousel();
            }

            function prevSlide() {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                updateCarousel();
            }

            function goToSlide(index) {
                currentIndex = index;
                updateCarousel();
            }

            nextBtn.addEventListener('click', nextSlide);
            prevBtn.addEventListener('click', prevSlide);

            document.addEventListener('keydown', (e) => {
                if (mainContent.style.display === 'none') return;
                if (e.key === 'ArrowRight') nextSlide();
                if (e.key === 'ArrowLeft') prevSlide();
            });

            // 手勢與拖曳控制
            let startX = 0;
            let isDragging = false;
            let animationID = 0;

            function getPositionX(event) {
                return event.type.includes('mouse') ? event.pageX : event.touches[0].clientX;
            }

            function touchStart(event) {
                startX = getPositionX(event);
                isDragging = true;
                track.style.transition = 'none';
                animationID = requestAnimationFrame(animation);
            }

            function touchMove(event) {
                if (!isDragging) return;
                const currentX = getPositionX(event);
                const diff = currentX - startX;
                const containerWidth = track.clientWidth;
                const translated = -currentIndex * containerWidth + diff;
                track.style.transform = `translateX(${translated}px)`;
            }

            function touchEnd(event) {
                if (!isDragging) return;
                isDragging = false;
                cancelAnimationFrame(animationID);

                const movedBy = getPositionX(event) - startX;
                const threshold = 50;

                track.style.transition = 'transform 0.5s ease-out';

                if (movedBy < -threshold && currentIndex < totalSlides - 1) {
                    currentIndex += 1;
                } else if (movedBy > threshold && currentIndex > 0) {
                    currentIndex -= 1;
                }

                updateCarousel();
            }

            function animation() {
                if (isDragging) requestAnimationFrame(animation);
            }

            track.addEventListener('touchstart', touchStart, { passive: true });
            track.addEventListener('touchmove', touchMove, { passive: true });
            track.addEventListener('touchend', touchEnd);

            track.addEventListener('mousedown', touchStart);
            track.addEventListener('mousemove', touchMove);
            track.addEventListener('mouseup', touchEnd);
            track.addEventListener('mouseleave', () => {
                if (isDragging) {
                    isDragging = false;
                    track.style.transition = 'transform 0.5s ease-out';
                    updateCarousel();
                }
            });

            window.addEventListener('resize', () => {
                track.style.transition = 'none';
                updateCarousel();
                setTimeout(() => {
                    track.style.transition = 'transform 0.5s ease-out';
                }, 50);
            });
        });
    </script>
</body>

</html>

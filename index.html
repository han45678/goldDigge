<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖文故事</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Swiper CSS CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* 確保輪播容器維持絕對的 1:1 正方形比例 */
        .square-container {
            position: relative;
            width: 100%;
            max-width: 768px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
        }

        /* 自訂 Swiper 分頁圓點樣式 */
        #dots-container .swiper-pagination-bullet {
            width: 8px;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.5);
            opacity: 1;
            border-radius: 9999px;
            transition: all 0.3s ease;
            margin: 0 3px !important;
        }

        #dots-container .swiper-pagination-bullet:hover {
            background-color: rgba(255, 255, 255, 0.8);
        }

        #dots-container .swiper-pagination-bullet-active {
            width: 22px;
            background-color: #ffffff;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

    <!-- 密碼輸入區塊 -->
    <div id="auth-box" class="w-full max-w-sm bg-slate-800 p-6 rounded-2xl shadow-2xl border border-white/10 text-center">
        <h2 class="text-xl font-bold mb-4">請輸入存取密碼</h2>
        <input 
            type="password" 
            id="password-input" 
            placeholder="請輸入密碼" 
            class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 mb-3 text-center tracking-widest text-lg"
            autocomplete="off"
        >
        <p id="error-msg" class="text-rose-500 text-sm mb-3 hidden">密碼錯誤，請重新輸入</p>
        <button 
            id="submit-btn" 
            class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white rounded-lg font-medium transition duration-200">
            確認進入
        </button>
    </div>

    <!-- 主輪播外框 -->
    <main class="w-full max-w-[768px]" id="main" style="display: none;">
        <div class="relative w-full group">

            <!-- 左上角頁數指示器：手機版置於圖片左上方外側，電腦版 (md以上) 懸浮於左上角 -->
            <div class="mb-3 md:mb-0 md:absolute md:top-4 md:left-4 z-20 inline-block bg-slate-800 md:bg-slate-900/70 backdrop-blur-md text-white px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-semibold tracking-wider shadow-lg border border-white/10">
                <span id="current-slide">1</span> / <span id="total-slides">17</span>
            </div>

            <!-- Swiper 輪播主體 -->
            <div id="carousel" class="swiper square-container rounded-2xl overflow-hidden shadow-2xl bg-slate-800 select-none">
                <div class="swiper-wrapper">
                    <!-- Slide 1 ~ 17 -->
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./1.jpeg" alt="pic 1" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./2.jpeg" alt="pic 2" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./3.jpeg" alt="pic 3" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./4.jpeg" alt="pic 4" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./5.jpeg" alt="pic 5" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./6.jpeg" alt="pic 6" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./7.jpeg" alt="pic 7" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./8.jpeg" alt="pic 8" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./9.jpeg" alt="pic 9" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./10.jpeg" alt="pic 10" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./11.jpeg" alt="pic 11" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./12.jpeg" alt="pic 12" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./13.jpeg" alt="pic 13" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./14.jpeg" alt="pic 14" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./15.jpeg" alt="pic 15" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./16.jpeg" alt="pic 16" class="w-full h-full object-contain">
                    </div>
                    <div class="swiper-slide flex items-center justify-center">
                        <img src="./17.jpeg" alt="pic 17" class="w-full h-full object-contain">
                    </div>
                </div>

                <!-- 電腦版左右切換按鈕 (手機版自動隱藏，避免遮擋) -->
                <button id="prev-btn"
                    class="hidden md:flex absolute left-4 top-1/2 -translate-y-1/2 z-20 bg-slate-900/60 hover:bg-slate-900/90 text-white w-12 h-12 rounded-full items-center justify-center backdrop-blur-md transition-all duration-200 opacity-0 group-hover:opacity-100 hover:scale-105 active:scale-95 shadow-lg border border-white/10 focus:outline-none"
                    aria-label="上一張">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                    </svg>
                </button>

                <button id="next-btn"
                    class="hidden md:flex absolute right-4 top-1/2 -translate-y-1/2 z-20 bg-slate-900/60 hover:bg-slate-900/90 text-white w-12 h-12 rounded-full items-center justify-center backdrop-blur-md transition-all duration-200 opacity-0 group-hover:opacity-100 hover:scale-105 active:scale-95 shadow-lg border border-white/10 focus:outline-none"
                    aria-label="下一張">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>

            <!-- 底部圓點指示器：手機版置於圖片下方外側，電腦版 (md以上) 懸浮於底部中央 -->
            <div class="mt-4 md:mt-0 md:absolute md:bottom-4 md:left-1/2 md:-translate-x-1/2 z-20 flex justify-center w-full md:w-auto">
                <div id="dots-container"
                    class="!w-auto !static flex flex-wrap items-center justify-center gap-y-1.5 bg-slate-800 md:bg-slate-900/40 backdrop-blur-md px-3.5 py-2 rounded-full border border-white/10">
                </div>
            </div>

        </div>
    </main>

    <!-- 引入 Swiper JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- 驗證與 Swiper 初始化邏輯 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authBox = document.getElementById('auth-box');
            const mainContent = document.getElementById('main');
            const passwordInput = document.getElementById('password-input');
            const submitBtn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            const currentSlideEl = document.getElementById('current-slide');
            const totalSlidesEl = document.getElementById('total-slides');

            let swiperInstance = null;

            function initSwiper() {
                if (swiperInstance) return;

                swiperInstance = new Swiper('#carousel', {
                    loop: true,
                    speed: 400,
                    grabCursor: true,
                    keyboard: {
                        enabled: true,
                    },
                    navigation: {
                        nextEl: '#next-btn',
                        prevEl: '#prev-btn',
                    },
                    pagination: {
                        el: '#dots-container',
                        clickable: true,
                    },
                    on: {
                        init: function () {
                            totalSlidesEl.textContent = this.slides.length;
                            currentSlideEl.textContent = this.realIndex + 1;
                        },
                        slideChange: function () {
                            currentSlideEl.textContent = this.realIndex + 1;
                        }
                    }
                });
            }

            function checkPassword() {
                if (passwordInput.value.trim() === '0717') {
                    authBox.style.display = 'none';
                    mainContent.style.display = 'block';
                    initSwiper();
                } else {
                    errorMsg.classList.remove('hidden');
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            }

            submitBtn.addEventListener('click', checkPassword);
            passwordInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkPassword();
            });
        });
    </script>
</body>

</html>
